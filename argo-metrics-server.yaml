apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argo-metrics-server
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/patilaniruddha1998/argocd
    path: metrics-server
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true